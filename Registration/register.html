<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./register.css">
</head>
<body>
    <form action="" id="formContainer">
        <div id="top">
            <h2>Create Account</h2>
            <p>Please fill in your details to register</p>
        </div>
        <div class="fields">
            <label for=""><strong>Full Name</strong><input type="text" name="" id="name" placeholder="Enter Full Name"></label>
            <label for=""><strong>Email Address</strong><input type="email" name="" id="email" placeholder="Enter email address"></label>
            <label for=""><strong>Password</strong><input type="password" name="" id="password" placeholder="Enter Password"></label>
            <label for=""><strong>Mobile Number</strong><input type="tel"name="" id="mobile" placeholder="Enter Mobile number"></label>
            <button type="submit" class="btn">Register</button>
            <p>Already have an account? <span><a href="./login.html">Signin</a></span></p>
        </div>
    </form>

    <script src="./register.js"></script>
</body>
</html>
